name: Flirty
options:
  bundleIdPrefix: com.flirty
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.2"
    GENERATE_INFOPLIST_FILE: YES
    # Project-wide: the test bundles need signing too when running on a device,
    # not just the app.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7JF6XQC536
targets:
  Flirty:
    type: application
    platform: iOS
    sources:
      - Flirty
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7JF6XQC536
  FlirtyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlirtyTests
    dependencies:
      - target: Flirty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.tests
  FlirtyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlirtyUITests
    dependencies:
      - target: Flirty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.uitests
# Declared here because `xcodegen generate` rewrites the project and deletes any
# scheme it does not know about. The shared Flirty.xcscheme used to be committed by
# hand, so regenerating silently broke every xcodebuild command in CLAUDE.md.
schemes:
  Flirty:
    build:
      targets:
        Flirty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlirtyTests
        - FlirtyUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
