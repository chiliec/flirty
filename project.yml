name: Flirty
options:
  bundleIdPrefix: com.flirty
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Flirty:
    type: application
    platform: iOS
    sources:
      - Flirty
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.app
  FlirtyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlirtyTests
    dependencies:
      - target: Flirty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.tests
  FlirtyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - FlirtyUITests
    dependencies:
      - target: Flirty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flirty.uitests
